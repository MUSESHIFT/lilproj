# money rundown — nginx reverse proxy
# reverse-proxies rundown.museshift.com to the bun server on 127.0.0.1:3000.
#
# install:
#   sudo cp deploy/nginx-money-rundown.conf /etc/nginx/sites-available/rundown.museshift.com
#   sudo ln -s /etc/nginx/sites-available/rundown.museshift.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rundown.museshift.com
#
# certbot rewrites this file in place to add the :443 tls block and redirect.
# what's below is the plain :80 server it starts from.

server {
    listen 80;
    listen [::]:80;
    server_name rundown.museshift.com;

    # modest cap — this is a personal digest app, not an upload service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket / upgrade passthrough (harmless if unused)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
